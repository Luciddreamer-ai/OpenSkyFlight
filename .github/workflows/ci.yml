# CI for OpenSkyFlight.
#
# The repo already defines both gates in package.json (`npm run lint` and
# `npm run format:check`); they were simply never wired to anything, so a
# regression could land silently. This workflow runs both on every push and PR.
#
# Notes:
#  - No test suite exists yet, so there is no `npm test` step. When tests are
#    added, add them here — the point of this file is that the gate is real.
#  - `npm ci` requires package-lock.json to be in sync with package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

  import-graph:
    name: Import graph resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Catches unresolved relative imports (e.g. a module importing a sibling
      # that does not exist) without booting a browser. js/ is served as native
      # ES modules, so a bad specifier is a runtime 404 that lint cannot see.
      - name: Check every relative import resolves
        run: node scripts/check-imports.mjs
