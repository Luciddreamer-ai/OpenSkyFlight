# Deploy to GitHub Pages.
#
# The site is already a static bundle — there is no build step, which is the
# whole point of the importmap approach. So this workflow does not build
# anything: it publishes the working tree as-is, and deliberately refuses to
# publish a commit that has not passed the CI gate.
#
# Why the guard matters: a broken import or a failing detector that reaches
# main would otherwise be pushed straight to the live site with nothing in
# between. Pages already builds from main automatically via the repository
# setting, so this is an ADDITIONAL explicit deploy, not a replacement — it
# exists to make the deploy a deliberate, gated act.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Pages rejects concurrent publishes, and a
# cancelled publish can leave a half-updated deployment queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate, then publish
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CI passed for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 50,
            });
            const ci = runs.workflow_runs.filter(r => r.name === 'CI' && r.event === 'push');
            if (!ci.length) core.setFailed(`No CI run found for ${sha}`);
            else if (ci[0].conclusion !== 'success')
              core.setFailed(`CI is ${ci[0].status}/${ci[0].conclusion} for ${sha}; refusing to publish`);
            else core.info(`CI passed for ${sha}`);

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # `.` is the whole tree, including vendor/ and the vendored
          # three-tile fork that the importmap points at. It is included
          # because .nojekyll is present, so Jekyll will not strip it.
          path: '.'

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
